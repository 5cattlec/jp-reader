<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日本語ニュース リーダー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="show-furigana">
  <header class="topbar">
    <button id="navToggle" class="icon-btn" aria-label="메뉴">☰</button>
    <a href="#" class="brand" id="brand">日本語ニュース<span class="sub">リーダー</span></a>
    <div class="controls">
      <button id="toggleFuri" class="btn" aria-pressed="true">ふりがな</button>
      <button id="toggleKo" class="btn" aria-pressed="false">한국어</button>
      <div class="seg" id="voiceSeg" aria-label="音声"></div>
      <label class="size">文字<input id="fontRange" type="range" min="16" max="30" value="20" /></label>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a class="navitem" data-view="articles" href="#">📰 기사</a>
      <a class="navitem" data-view="feedback" href="#feedback">💬 피드백</a>
      <a class="navitem" href="admin.html">🔒 관리자</a>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main>
      <!-- 기사(게시판) -->
      <section id="home" class="home view">
        <div class="homebar">
          <input id="search" class="search" type="search" placeholder="검색…" />
          <button id="favFilter" class="btn small" aria-pressed="false">★ 즐겨찾기</button>
          <span id="sitecount" class="sitecount"></span>
        </div>
        <div id="cards" class="cards"></div>
        <div id="pager" class="pager"></div>
      </section>

      <!-- 읽기 -->
      <section id="reader" class="reader view" hidden></section>

      <!-- 피드백 -->
      <section id="feedback" class="feedback view" hidden>
        <h2 class="fb-title">💬 피드백</h2>
        <p class="fb-desc">사이트에 바라는 점·오류·의견을 남겨주세요.</p>
        <div class="fb-form">
          <input id="fbNick" class="fb-nick" maxlength="40" placeholder="닉네임 (선택)" />
          <textarea id="fbMsg" class="fb-msg" maxlength="2000" rows="3" placeholder="내용을 입력하세요…"></textarea>
          <div class="fb-actions"><span id="fbNote" class="fb-note"></span><button id="fbSend" class="btn primary">남기기</button></div>
        </div>
        <div id="fbList" class="fb-list"></div>
      </section>
    </main>
  </div>

  <footer class="foot">
    <span id="updated"></span>
    <span class="hint">個人学習用 · 単語クリックで意味 · ▶로 문장별 재생</span>
  </footer>

  <div id="popup" class="popup" hidden>
    <div class="pop-word"></div>
    <div class="pop-read"></div>
    <div class="pop-links">
      <a class="pop-naver" target="_blank" rel="noopener">네이버 사전</a>
      <a class="pop-weblio" target="_blank" rel="noopener">Weblio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
