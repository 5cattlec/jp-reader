<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jp-reader 관리자</title>
  <style>
    :root{--bg:#f6f3ec;--panel:#fffdf8;--ink:#2b2622;--muted:#8b8378;--line:#e6e0d4;--accent:#c0492f;--ko:#2f6fb0;--gold:#e0a52e}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Malgun Gothic","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
    header h1{font-size:18px;margin:0;margin-right:auto}
    header h1 span{color:var(--accent)}
    .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
    .btn:hover{border-color:var(--accent);color:var(--accent)}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    main{max-width:960px;margin:0 auto;padding:24px 20px 60px}
    .login{max-width:340px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
    .login h2{margin:0 0 16px;font-size:17px}
    .login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:14px}
    .err{color:var(--accent);font-size:13px;min-height:1.2em}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
    .stat .n{font-size:26px;font-weight:700}
    .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
    section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
    section h3{margin:0 0 14px;font-size:15px}
    .chart{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-bottom:2px}
    .chart .bar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
    .chart .bar:hover{opacity:.8}
    .chart .bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;display:none}
    .chart .bar:hover span{display:block}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600}
    td.num,th.num{text-align:right}
    .roll{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
    .hidebtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
    .hidebtn.on{background:#fbe3dd;border-color:var(--accent);color:var(--accent)}
    .muted{color:var(--muted);font-size:12px}
    a.home{font-size:13px;color:var(--muted)}
    @media(max-width:640px){.roll{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
